version: v2
clean: true
managed:
  # 上游 proto 面向 Java，通常不带 option go_package，这里统一注入
  enabled: true
  override:
    - file_option: go_package_prefix
      value: git.corp.kuaishou.com/klingai-agentk/agentk-upstream.git/go/gen
plugins:
  - local: protoc-gen-go
    out: go/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: go/gen
    opt:
      - paths=source_relative
