openapi: 3.1.0
info:
  title: Storyboard Example API
  version: 1.0.0
  description: >-
    A small downstream application that starts storyboard-film pipelines through
    agent-k. Job metadata is held in memory and is lost when the API server
    restarts.
tags:
  - name: Jobs
    description: Create and inspect storyboard-film jobs.
  - name: System
    description: Service health.
paths:
  /v1/jobs:
    post:
      tags: [Jobs]
      summary: Create a storyboard-film job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            examples:
              rainyNight:
                value:
                  topic: 雨夜里穿过霓虹街道的猫
                  shots: 1
      responses:
        "202":
          description: The job was accepted and is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
    get:
      tags: [Jobs]
      summary: List jobs
      description: >-
        Returns jobs in reverse creation order. Running jobs are refreshed from
        agent-k before they are returned.
      operationId: listJobs
      responses:
        "200":
          description: The current in-memory job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Get a job
      description: Refreshes a running job from agent-k before returning it.
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          description: The public job identifier.
          schema:
            type: string
            pattern: "^job_[0-9a-f]{24}$"
          example: job_0b49d83f42cfbc81bc8566eb
      responses:
        "200":
          description: The job snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
  /healthz:
    get:
      tags: [System]
      summary: Check service health
      operationId: healthz
      responses:
        "200":
          description: The API server is running.
          content:
            text/plain:
              schema:
                type: string
                const: ok
              examples:
                healthy:
                  value: ok
components:
  schemas:
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [topic]
      properties:
        topic:
          type: string
          minLength: 1
          description: The subject of the storyboard film.
          examples:
            - 雨夜里穿过霓虹街道的猫
        shots:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: The requested number of shots.
    Job:
      type: object
      additionalProperties: false
      required: [id, status, topic, shots, createdAt]
      properties:
        id:
          type: string
          description: The downstream application's public job identifier.
          examples:
            - job_0b49d83f42cfbc81bc8566eb
        status:
          $ref: "#/components/schemas/JobStatus"
        topic:
          type: string
        shots:
          type: integer
          minimum: 1
          maximum: 8
        output:
          $ref: "#/components/schemas/StoryboardOutput"
        error:
          type: string
          description: Present when the job has failed.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    JobStatus:
      type: string
      enum: [running, completed, failed]
    StoryboardOutput:
      type: object
      additionalProperties: false
      required: [artifacts, clipCount]
      properties:
        artifacts:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/Artifact"
        clipCount:
          type: integer
          minimum: 1
    Artifact:
      type: object
      additionalProperties: false
      required: [type, uri]
      properties:
        type:
          type: string
          const: video
        uri:
          type: string
          format: uri
          description: The generated film URL.
        description:
          type: string
        model:
          type: string
        params:
          type: object
          additionalProperties: true
    JobList:
      type: object
      additionalProperties: false
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidShots:
              value:
                error: shots must be an integer between 1 and 8
    NotFound:
      description: The job does not exist in this server's in-memory store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            jobNotFound:
              value:
                error: job not found
    InternalServerError:
      description: The API server could not create or store the job.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The agent-k upstream request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstreamFailure:
              value:
                error: failed to query AgentK pipeline
