<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 集市</title>
<style>
  :root {
    --paper: #f2efe6;
    --paper-light: #fffdf6;
    --ink: #191917;
    --muted: #716e66;
    --line: #cbc5b7;
    --red: #dd5b46;
    --blue: #536fb7;
    --green: #167860;
    --display: "Iowan Old Style", "Songti SC", "STSong", Georgia, serif;
    --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      linear-gradient(rgba(25, 25, 23, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 25, 23, .035) 1px, transparent 1px),
      var(--paper);
    background-size: 32px 32px;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .2;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");
  }

  a { color: inherit; }
  button, input { font: inherit; }
  .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }

  header {
    height: 82px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  nav { display: flex; align-items: center; justify-content: space-between; gap: 28px; }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: var(--ink);
    color: var(--paper-light);
    font-family: var(--display);
    font-size: 17px;
    transform: rotate(-3deg);
  }
  .brand strong {
    display: block;
    font-family: var(--display);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -.03em;
  }
  .brand small {
    display: block;
    margin-top: 1px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .nav-meta {
    display: flex;
    align-items: center;
    gap: 22px;
    color: var(--muted);
    font-size: 13px;
  }
  .nav-meta a { text-underline-offset: 4px; }
  .available {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .available::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(22, 120, 96, .12);
  }
  .nav-cta {
    padding: 9px 18px;
    border: 1px solid var(--ink);
    color: var(--ink);
    background: #e8c953;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .04em;
    text-decoration: none;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .15s, box-shadow .15s;
  }
  .nav-cta:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--ink);
  }

  .hero {
    position: relative;
    min-height: 405px;
    padding: 76px 0 68px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero::after {
    content: "AGENT";
    position: absolute;
    right: -16px;
    bottom: -45px;
    color: transparent;
    -webkit-text-stroke: 1px rgba(25, 25, 23, .12);
    font-family: var(--display);
    font-size: clamp(130px, 19vw, 260px);
    line-height: .8;
    letter-spacing: -.08em;
    pointer-events: none;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
    color: var(--red);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .eyebrow::before { content: ""; width: 35px; height: 2px; background: var(--red); }
  h1 {
    max-width: 820px;
    margin: 0;
    font-family: var(--display);
    font-size: clamp(48px, 7.2vw, 92px);
    font-weight: 500;
    line-height: .98;
    letter-spacing: -.06em;
  }
  h1 em { color: var(--blue); font-weight: inherit; }
  .hero-copy {
    max-width: 570px;
    margin: 28px 0 0;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.8;
  }

  .catalog { padding: 54px 0 86px; }
  .catalog-head {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
    margin-bottom: 27px;
  }
  .catalog-title {
    margin: 0;
    font-family: var(--display);
    font-size: 31px;
    font-weight: 600;
    letter-spacing: -.03em;
  }
  .catalog-title span {
    margin-left: 9px;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .02em;
  }
  .controls { display: flex; align-items: center; gap: 10px; }
  .search {
    width: 240px;
    height: 40px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 0;
    outline: none;
    color: var(--ink);
    background: rgba(255, 253, 246, .55);
    transition: border-color .2s, background .2s;
  }
  .search:focus { border-color: var(--ink); background: var(--paper-light); }
  .search::placeholder { color: #9a968b; }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter {
    flex: none;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: transparent;
    font-size: 12px;
    cursor: pointer;
    transition: all .18s;
  }
  .filter:hover, .filter.active {
    border-color: var(--ink);
    color: var(--paper-light);
    background: var(--ink);
  }

  .agent-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 20px;
  }
  .agent-card {
    grid-column: 1 / -1;
    min-height: 320px;
    display: grid;
    grid-template-columns: minmax(280px, .72fr) 1.28fr;
    border: 1px solid var(--ink);
    background: var(--paper-light);
    color: inherit;
    text-decoration: none;
    box-shadow: 8px 8px 0 var(--ink);
    transition: transform .2s ease, box-shadow .2s ease;
    animation: rise .55s both;
  }
  .agent-card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 13px 13px 0 var(--ink);
  }
  .agent-card.compact {
    grid-column: 1 / -1;
    min-height: 320px;
    grid-template-columns: minmax(280px, .72fr) 1.28fr;
    box-shadow: 8px 8px 0 var(--ink);
  }
  .agent-card.compact .agent-visual { min-height: 300px; }
  .agent-card.compact .agent-body { padding: 31px 32px 28px; }
  .agent-card.compact .agent-name { font-size: clamp(31px, 3.3vw, 45px); }
  .agent-visual {
    position: relative;
    min-height: 300px;
    padding: 24px;
    overflow: hidden;
    background: #dcd7c9;
    border-right: 1px solid var(--ink);
  }
  .agent-visual::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .35;
    background:
      radial-gradient(circle at 78% 16%, var(--red) 0 12%, transparent 12.5%),
      linear-gradient(135deg, transparent 0 47%, rgba(25,25,23,.13) 47.5% 48%, transparent 48.5%);
  }
  .comic-page {
    position: absolute;
    inset: 38px 36px 32px 32px;
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    grid-template-rows: 1fr .82fr;
    gap: 8px;
    transform: rotate(-2deg);
  }
  .panel {
    position: relative;
    overflow: hidden;
    border: 3px solid var(--ink);
    background: var(--paper-light);
  }
  .panel:first-child { grid-row: span 2; background: var(--blue); }
  .panel:nth-child(2) { background: #e8c953; }
  .panel:nth-child(3) { background: var(--red); }
  .panel:first-child::before {
    content: "";
    position: absolute;
    left: 18%;
    top: 19%;
    width: 62%;
    height: 62%;
    border: 4px solid var(--ink);
    border-radius: 48% 48% 42% 42%;
    background:
      radial-gradient(circle at 35% 42%, var(--ink) 0 4%, transparent 5%),
      radial-gradient(circle at 65% 42%, var(--ink) 0 4%, transparent 5%),
      var(--paper-light);
  }
  .panel:first-child::after {
    content: "";
    position: absolute;
    left: 36%;
    top: 59%;
    width: 28%;
    height: 3px;
    background: var(--ink);
    transform: rotate(-5deg);
  }
  .panel:nth-child(2)::before {
    content: "!";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-size: 70px;
    font-weight: 800;
    transform: rotate(8deg);
  }
  .panel:nth-child(3)::before {
    content: "ACTION";
    position: absolute;
    left: 12px;
    bottom: 8px;
    color: var(--paper-light);
    font-family: var(--display);
    font-size: 22px;
    font-style: italic;
    font-weight: 800;
  }
  .agent-visual.creative { background: #c8d0e5; }
  .agent-visual.creative .panel:first-child { background: var(--paper-light); }
  .agent-visual.creative .panel:first-child::before {
    content: "✦";
    inset: 0;
    width: auto;
    height: auto;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 0;
    background: transparent;
    font-family: var(--display);
    font-size: 76px;
  }
  .agent-visual.creative .panel:first-child::after { display: none; }
  .agent-visual.creative .panel:nth-child(2)::before { content: "IDEA"; font-size: 20px; }
  .agent-visual.creative .panel:nth-child(3)::before { content: "MAKE"; }
  .agent-visual.media { background: #e4c8bc; }
  .agent-visual.media .panel:first-child { background: var(--red); }
  .agent-visual.media .panel:first-child::before {
    left: 17%;
    top: 23%;
    width: 66%;
    height: 50%;
    border-radius: 0;
    background: linear-gradient(145deg, var(--blue) 0 48%, #e8c953 49%);
  }
  .agent-visual.media .panel:first-child::after { left: 30%; top: 48%; width: 40%; background: var(--paper-light); }
  .agent-visual.media .panel:nth-child(2)::before { content: "▶"; font-size: 44px; }
  .agent-visual.media .panel:nth-child(3)::before { content: "FRAME"; }
  .agent-visual.research { background: #c7d8ce; }
  .agent-visual.research .panel:first-child { background: var(--green); }
  .agent-visual.research .panel:first-child::before {
    left: 20%;
    top: 18%;
    width: 50%;
    height: 50%;
    border-radius: 50%;
    background: var(--paper-light);
  }
  .agent-visual.research .panel:first-child::after {
    left: 62%;
    top: 67%;
    width: 27%;
    height: 6px;
    transform: rotate(45deg);
  }
  .agent-visual.research .panel:nth-child(2)::before { content: "01"; font-size: 38px; }
  .agent-visual.research .panel:nth-child(3)::before { content: "SOURCE"; font-size: 17px; }
  .agent-visual.basic { background: #d9d5ca; }
  .agent-visual.basic .panel:first-child { background: var(--ink); }
  .agent-visual.basic .panel:first-child::before {
    content: "A";
    inset: 0;
    width: auto;
    height: auto;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 0;
    color: var(--paper-light);
    background: transparent;
    font-family: var(--display);
    font-size: 94px;
  }
  .agent-visual.basic .panel:first-child::after { display: none; }
  .agent-visual.basic .panel:nth-child(2)::before { content: "?"; }
  .agent-visual.basic .panel:nth-child(3)::before { content: "CHAT"; }
  .visual-label {
    position: absolute;
    left: 18px;
    bottom: 14px;
    padding: 5px 8px;
    border: 1px solid var(--ink);
    background: var(--paper-light);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .13em;
  }
  .agent-body {
    display: flex;
    flex-direction: column;
    padding: 31px 32px 28px;
  }
  .agent-topline {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .agent-meta-right { display: flex; align-items: center; gap: 12px; }
  .agent-kind {
    min-width: 72px;
    padding: 5px 9px 4px;
    border: 1px solid var(--ink);
    color: var(--paper-light);
    background: var(--ink);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .12em;
    text-align: center;
  }
  .agent-kind.chat {
    color: var(--ink);
    background: #e8c953;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
  }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .agent-index { color: var(--muted); font-family: var(--display); font-size: 13px; }
  .agent-name {
    margin: 0 0 13px;
    font-family: var(--display);
    font-size: clamp(31px, 3.3vw, 45px);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -.045em;
  }
  .agent-description {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.75;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px; }
  .tag {
    padding: 5px 9px;
    border: 1px solid var(--line);
    color: #5f5c55;
    font-size: 10px;
    letter-spacing: .03em;
  }
  .launch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    font-weight: 700;
  }
  .launch-arrow {
    width: 35px;
    height: 35px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--paper-light);
    background: var(--ink);
    font-size: 18px;
    transition: transform .2s;
  }
  .agent-card:hover .launch-arrow { transform: translateX(3px); }

  .coming-card {
    grid-column: 1 / -1;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px;
    border: 1px dashed #aaa497;
    background: rgba(255, 253, 246, .35);
    animation: rise .55s .08s both;
  }
  .coming-card .plus {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--muted);
    font-family: var(--display);
    font-size: 27px;
  }
  .coming-card h3 {
    margin: 0 0 12px;
    font-family: var(--display);
    font-size: 25px;
    font-weight: 600;
  }
  .coming-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

  .empty {
    grid-column: 1 / -1;
    padding: 70px 24px;
    border: 1px dashed var(--line);
    color: var(--muted);
    text-align: center;
  }
  footer {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 25px 0 32px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .04em;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 860px) {
    .shell { width: min(100% - 30px, 680px); }
    .nav-meta > span:not(.available) { display: none; }
    .hero { min-height: 360px; padding: 65px 0 58px; }
    .hero::after { opacity: .55; }
    .catalog-head { grid-template-columns: 1fr; }
    .search { width: 100%; }
    .controls { width: 100%; }
    .agent-card, .agent-card.compact, .coming-card { grid-column: 1 / -1; }
    .agent-card { grid-template-columns: 1fr; }
    .agent-card.compact { grid-template-columns: 1fr; }
    .agent-visual { min-height: 270px; border-right: 0; border-bottom: 1px solid var(--ink); }
  }
  @media (max-width: 520px) {
    header { height: 72px; }
    .nav-meta a { display: none; }
    .nav-meta a.nav-cta { display: inline-block; }
    h1 { font-size: 48px; }
    .hero-copy { font-size: 14px; }
    .agent-card { box-shadow: 5px 5px 0 var(--ink); }
    .agent-body { padding: 27px 24px 24px; }
    footer { flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <nav class="shell">
    <a class="brand" href="/" aria-label="Agent 集市首页">
      <span class="brand-mark">A</span>
      <span><strong>Agent 集市</strong><small>AgentK Showcase</small></span>
    </a>
    <div class="nav-meta">
      <span>发现可直接使用的智能工作流</span>
      <a href="#catalog">浏览全部</a>
      <span class="available">服务在线</span>
      <a class="nav-cta" href="/assets/">资产库 →</a>
    </div>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="shell">
      <div class="eyebrow">Agent marketplace · Preview 01</div>
      <h1>把复杂工作，<br>交给一个<em>专业 Agent</em></h1>
      <p class="hero-copy">这里集合了可以直接使用的 Agent 应用。选择一个场景，输入你的目标，让模型与工具完成从理解到交付的整段工作。</p>
    </div>
  </section>

  <section class="catalog shell" id="catalog">
    <div class="catalog-head">
      <h2 class="catalog-title">精选 Agent <span id="agentCount"></span></h2>
      <div class="controls">
        <input class="search" id="searchInput" type="search" placeholder="搜索 Agent 或能力" aria-label="搜索 Agent">
      </div>
    </div>
    <div class="filters" id="filters" aria-label="Agent 分类"></div>
    <div class="agent-grid" id="agentGrid"></div>
  </section>
</main>

<footer class="shell">
  <span>AGENTK · 把能力封装成可使用的产品</span>
  <span>7 个专业 Agent 已接入</span>
</footer>

<script>
"use strict";

// 目录数据来自 /v1/agents：服务端聚合各 Agent 目录的 meta.json，
// 新增 Agent 只需添加目录并在 studio 目录登记，无需改这个页面。
let AGENTS = [];

async function loadAgents() {
  const response = await fetch("/v1/agents", { headers: { Accept: "application/json" } });
  if (!response.ok) throw new Error("HTTP " + response.status);
  const payload = await response.json();
  return (payload.agents || []).map((agent) => ({
    id: agent.id,
    name: agent.name,
    description: agent.description,
    category: agent.category,
    tags: agent.tags || [],
    href: agent.href,
    status: agent.status || "可使用",
    kind: agent.kind === "chat" ? "CHAT" : "WORKSHOP",
    visual: agent.visual || "creative",
    visualLabel: agent.visualLabel || agent.name,
  }));
}

let categories = ["全部"];
let activeCategory = "全部";
let query = "";

function escapeHTML(value) {
  const node = document.createElement("div");
  node.textContent = value;
  return node.innerHTML;
}

function renderFilters() {
  const box = document.getElementById("filters");
  box.innerHTML = "";
  categories.forEach((category) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "filter" + (category === activeCategory ? " active" : "");
    button.textContent = category;
    button.onclick = () => {
      activeCategory = category;
      renderFilters();
      renderAgents();
    };
    box.appendChild(button);
  });
}

function renderAgents() {
  const normalized = query.trim().toLowerCase();
  const visible = AGENTS.filter((agent) => {
    const inCategory = activeCategory === "全部" || agent.category === activeCategory;
    const haystack = [agent.name, agent.description, agent.category, ...agent.tags].join(" ").toLowerCase();
    return inCategory && (!normalized || haystack.includes(normalized));
  });
  document.getElementById("agentCount").textContent = visible.length + " 个可用";

  const grid = document.getElementById("agentGrid");
  if (!visible.length) {
    grid.innerHTML = '<div class="empty">没有找到匹配的 Agent，试试其他关键词。</div>';
    return;
  }
  grid.innerHTML = visible.map((agent) => {
    const catalogIndex = AGENTS.findIndex((item) => item.id === agent.id);
    return `
    <a class="agent-card ${catalogIndex === 0 ? "featured" : "compact"}" href="${escapeHTML(agent.href)}" aria-label="打开${escapeHTML(agent.name)}">
      <div class="agent-visual ${escapeHTML(agent.visual)}" aria-hidden="true">
        <div class="comic-page"><span class="panel"></span><span class="panel"></span><span class="panel"></span></div>
        <span class="visual-label">${escapeHTML(agent.visualLabel)}</span>
      </div>
      <div class="agent-body">
        <div class="agent-topline">
          <span class="status">${escapeHTML(agent.status)}</span>
          <span class="agent-meta-right">
            <span class="agent-index">NO. ${String(catalogIndex + 1).padStart(2, "0")}</span>
            <span class="agent-kind ${agent.kind === "CHAT" ? "chat" : "pipeline"}">${escapeHTML(agent.kind)}</span>
          </span>
        </div>
        <h3 class="agent-name">${escapeHTML(agent.name)}</h3>
        <p class="agent-description">${escapeHTML(agent.description)}</p>
        <div class="tags">${agent.tags.map((tag) => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
        <div class="launch"><span>进入 Agent</span><span class="launch-arrow">→</span></div>
      </div>
    </a>
  `}).join("") + `
  <aside class="coming-card">
    <span class="plus">+</span>
    <div><h3>更多 Agent，正在上架</h3><p>新的专业能力会继续作为独立工作区加入集市。</p></div>
  </aside>`;
}

document.getElementById("searchInput").addEventListener("input", (event) => {
  query = event.target.value;
  renderAgents();
});

(async () => {
  const grid = document.getElementById("agentGrid");
  try {
    AGENTS = await loadAgents();
  } catch (error) {
    grid.innerHTML = '<div class="empty">目录加载失败（' + escapeHTML(String(error.message || error)) + '），请刷新重试。</div>';
    return;
  }
  categories = ["全部", ...new Set(AGENTS.map((agent) => agent.category))];
  renderFilters();
  renderAgents();
})();
</script>
</body>
</html>
