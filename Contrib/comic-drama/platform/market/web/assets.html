<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资产库 · Agent 集市</title>
<style>
  :root {
    --paper: #f2efe6;
    --paper-light: #fffdf6;
    --ink: #191917;
    --muted: #716e66;
    --line: #cbc5b7;
    --red: #dd5b46;
    --blue: #536fb7;
    --green: #167860;
    --display: "Iowan Old Style", "Songti SC", "STSong", Georgia, serif;
    --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      linear-gradient(rgba(25, 25, 23, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(25, 25, 23, .035) 1px, transparent 1px),
      var(--paper);
    background-size: 32px 32px;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }

  header {
    height: 82px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  nav { display: flex; align-items: center; justify-content: space-between; gap: 28px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: var(--ink);
    color: var(--paper-light);
    font-family: var(--display);
    font-size: 17px;
    transform: rotate(-3deg);
  }
  .brand strong { display: block; font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  .brand small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
  .nav-meta { display: flex; align-items: center; gap: 22px; color: var(--muted); font-size: 13px; }
  .nav-meta a { text-underline-offset: 4px; }

  .page-head { padding: 52px 0 34px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    color: var(--red);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .eyebrow::before { content: ""; width: 35px; height: 2px; background: var(--red); }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(38px, 5vw, 60px);
    font-weight: 500;
    letter-spacing: -.05em;
    line-height: 1.02;
  }
  .page-copy { max-width: 560px; margin: 18px 0 0; color: var(--muted); font-size: 14px; line-height: 1.8; }

  .library { padding: 40px 0 90px; }
  .lib-meta { margin-bottom: 26px; color: var(--muted); font-size: 13px; }

  .project {
    margin-bottom: 34px;
    border: 1px solid var(--ink);
    background: var(--paper-light);
    box-shadow: 8px 8px 0 var(--ink);
    animation: rise .5s both;
  }
  .project-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 12px 18px;
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--line);
  }
  .project-title {
    margin: 0;
    font-family: var(--display);
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -.03em;
  }
  .project-agent {
    padding: 4px 9px;
    border: 1px solid var(--ink);
    background: #e8c953;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .1em;
  }
  .project-agent.drama { color: var(--paper-light); background: var(--blue); }
  .project-time { margin-left: auto; color: var(--muted); font-size: 12px; }

  .group { padding: 20px 26px 6px; }
  .group:last-child { padding-bottom: 24px; }
  .group-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .asset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
    margin-bottom: 18px;
  }
  .asset {
    border: 1px solid var(--line);
    background: var(--paper);
  }
  .asset .media {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    /* contain 而不是 cover：竖版图完整展示，不裁切成横版。 */
    object-fit: contain;
    background: #e9e5d8;
    border: 0;
    border-bottom: 1px solid var(--line);
  }
  .asset audio.media { aspect-ratio: auto; height: 44px; padding: 4px 6px; }
  .asset-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .asset-tool {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .asset-actions { display: flex; gap: 10px; flex: none; }
  .asset-actions a { font-weight: 700; text-underline-offset: 3px; }

  .empty, .loading {
    padding: 80px 24px;
    border: 1px dashed var(--line);
    color: var(--muted);
    text-align: center;
    font-size: 14px;
    line-height: 1.8;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 860px) {
    .shell { width: min(100% - 30px, 680px); }
    .project { box-shadow: 5px 5px 0 var(--ink); }
    .project-time { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <nav class="shell">
    <a class="brand" href="/" aria-label="返回 Agent 集市">
      <span class="brand-mark">A</span>
      <span><strong>Agent 集市</strong><small>AgentK Showcase</small></span>
    </a>
    <div class="nav-meta">
      <a href="/">← 返回集市</a>
    </div>
  </nav>
</header>

<main>
  <section class="page-head shell">
    <div class="eyebrow">Asset library</div>
    <h1>资产库</h1>
    <p class="page-copy">各 Agent 服务产出的全部素材，按项目归档、按类型分列。仅供浏览与下载。</p>
  </section>

  <section class="library shell">
    <div class="lib-meta" id="libMeta"></div>
    <div id="projects"><div class="loading">正在加载资产…</div></div>
  </section>
</main>

<script>
"use strict";

const KIND_LABEL = { image: "图片", video: "视频", audio: "音频" };
const KIND_ORDER = ["image", "video", "audio"];

function escapeHTML(value) {
  const node = document.createElement("div");
  node.textContent = value == null ? "" : String(value);
  return node.innerHTML;
}

function formatTime(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) +
    " " + pad(date.getHours()) + ":" + pad(date.getMinutes());
}

function downloadHref(uri) {
  return "/v1/assets/download?uri=" + encodeURIComponent(uri);
}

function assetCard(asset) {
  const uri = escapeHTML(asset.uri);
  let media;
  if (asset.kind === "image") {
    media = '<img class="media" src="' + uri + '" loading="lazy" alt="">';
  } else if (asset.kind === "video") {
    media = '<video class="media" src="' + uri + '" controls preload="metadata"></video>';
  } else {
    media = '<audio class="media" src="' + uri + '" controls preload="metadata"></audio>';
  }
  return '<div class="asset">' + media +
    '<div class="asset-foot">' +
      '<span class="asset-tool">' + escapeHTML(asset.tool || "") + "</span>" +
      '<span class="asset-actions">' +
        '<a href="' + downloadHref(asset.uri) + '">下载</a>' +
        '<a href="' + uri + '" target="_blank" rel="noopener">原链 ↗</a>' +
      "</span>" +
    "</div></div>";
}

function projectSection(project) {
  const groups = { image: [], video: [], audio: [] };
  (project.assets || []).forEach((asset) => {
    if (groups[asset.kind]) groups[asset.kind].push(asset);
  });
  const body = KIND_ORDER
    .filter((kind) => groups[kind].length)
    .map((kind) =>
      '<div class="group">' +
        '<h3 class="group-title">' + KIND_LABEL[kind] + " · " + groups[kind].length + "</h3>" +
        '<div class="asset-grid">' + groups[kind].map(assetCard).join("") + "</div>" +
      "</div>")
    .join("");
  return '<article class="project">' +
    '<div class="project-head">' +
      '<h2 class="project-title">' + escapeHTML(project.title) + "</h2>" +
      '<span class="project-agent ' + (project.kind === "drama" ? "drama" : "chat") + '">' +
        escapeHTML(project.agent) + "</span>" +
      '<span class="project-time">更新于 ' + formatTime(project.updatedAt) + "</span>" +
    "</div>" + body +
  "</article>";
}

async function load() {
  const box = document.getElementById("projects");
  let projects;
  try {
    const response = await fetch("/v1/assets", { headers: { Accept: "application/json" } });
    if (!response.ok) throw new Error("HTTP " + response.status);
    projects = (await response.json()).projects || [];
  } catch (error) {
    box.innerHTML = '<div class="empty">资产加载失败（' +
      escapeHTML(error.message || error) + "），请刷新重试。</div>";
    return;
  }
  const total = projects.reduce((sum, project) => sum + (project.assets || []).length, 0);
  document.getElementById("libMeta").textContent =
    projects.length + " 个项目 · " + total + " 条资产";
  if (!projects.length) {
    box.innerHTML = '<div class="empty">还没有任何资产。<br>去集市里用一个 Agent 创作点什么吧。</div>';
    return;
  }
  box.innerHTML = projects.map(projectSection).join("");
}

load();
</script>
</body>
</html>
