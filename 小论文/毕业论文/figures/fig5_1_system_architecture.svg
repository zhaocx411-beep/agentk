  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">图 5-1 多智能体详细设计文档自动生成系统三层总体架构与 SEAC + MAS-DRG 接入图</text>

  <!-- Layer 1: Application Layer (Multi-Agent-DetailedDesign) -->
  <rect x="35" y="52" width="890" height="145" rx="8" fill="#f4f8fc" stroke="#2b5c8f" stroke-width="1.8"/>
