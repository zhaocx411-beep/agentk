  <text x="769" y="487" text-anchor="middle" font-size="10.5" fill="#444">• 分章 .typ 源码组装与跨章节引用检查</text>
  <text x="769" y="505" text-anchor="middle" font-size="10.5" fill="#444">• 编译输出《详细设计规格书.pdf》交付件</text>

