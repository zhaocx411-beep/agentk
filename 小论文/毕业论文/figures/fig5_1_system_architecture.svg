  <text x="190" y="505" text-anchor="middle" font-size="10.5" fill="#444">• HNSW 向量索引 + Unit ID 元数据持久化</text>

  <rect x="345" y="446" width="270" height="80" rx="6" fill="#ffffff" stroke="#1b9e77" stroke-width="1.2"/>
  <text x="480" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f5c44">架构与流程图表渲染工具链</text>
  <text x="480" y="487" text-anchor="middle" font-size="10.5" fill="#444">• PlantUML / Mermaid 时序图与架构图生成</text>
  <text x="480" y="505" text-anchor="middle" font-size="10.5" fill="#444">• SVG / PNG 矢量转换与语法自动校验</text>

  <rect x="635" y="446" width="269" height="80" rx="6" fill="#ffffff" stroke="#1b9e77" stroke-width="1.2"/>
