  <text x="480" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">第一层：领域应用编排层（Multi-Agent-DetailedDesign · 详细设计生成应用）</text>

  <rect x="55" y="92" width="195" height="90" rx="6" fill="#ffffff" stroke="#2b5c8f" stroke-width="1.3"/>
  <text x="152" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3b5c">顶层协调与流程智能体</text>
  <text x="152" y="133" text-anchor="middle" font-size="10.5" fill="#444">detailed_design_agent</text>
  <text x="152" y="151" text-anchor="middle" font-size="10" fill="#666">工作区初始化 · 前期文档摘要</text>
  <text x="152" y="168" text-anchor="middle" font-size="10" fill="#2b5c8f">需求类型：上下文概述型 (T_macro)</text>

  <rect x="272" y="92" width="195" height="90" rx="6" fill="#ffffff" stroke="#2b5c8f" stroke-width="1.3"/>
  <text x="369" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3b5c">章节概述与架构智能体</text>
  <text x="369" y="133" text-anchor="middle" font-size="10.5" fill="#444">overview_agent</text>
  <text x="369" y="151" text-anchor="middle" font-size="10" fill="#666">总体架构 · 技术选型 · 功能综述</text>
  <text x="369" y="168" text-anchor="middle" font-size="10" fill="#2b5c8f">需求类型：上下文概述型 (T_macro)</text>

  <rect x="489" y="92" width="195" height="90" rx="6" fill="#ffffff" stroke="#d95f02" stroke-width="1.3"/>
  <text x="586" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3b00">模块与接口设计智能体</text>
  <text x="586" y="133" text-anchor="middle" font-size="10.5" fill="#444">interface_agent / module_agent</text>
  <text x="586" y="151" text-anchor="middle" font-size="10" fill="#666">服务接口路径 · 请求方式 · 参数表</text>
  <text x="586" y="168" text-anchor="middle" font-size="10" fill="#d95f02">需求类型：层次上下文型 (T_hier)</text>

  <rect x="706" y="92" width="198" height="90" rx="6" fill="#ffffff" stroke="#1b9e77" stroke-width="1.3"/>
  <text x="805" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f5c44">数据库与规格核查智能体</text>
  <text x="805" y="133" text-anchor="middle" font-size="10.5" fill="#444">database / constraint / trace_agent</text>
  <text x="805" y="151" text-anchor="middle" font-size="10" fill="#666">物理表字段 · 性能条款 · 纪要溯源</text>
  <text x="805" y="168" text-anchor="middle" font-size="10" fill="#1b9e77">需求类型：精确事实型 (T_atomic)</text>

  <!-- Layer 2: Core Runtime Framework Layer (Multi-Agent-Framework) -->
  <rect x="35" y="220" width="890" height="165" rx="8" fill="#fcfaf5" stroke="#b87333" stroke-width="1.8"/>
  <rect x="35" y="220" width="890" height="28" rx="8" fill="#b87333"/>
  <text x="480" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">第二层：多智能体核心运行时框架层（Multi-Agent-Framework · 核心抽象与内置 RAG 服务）</text>

  <rect x="55" y="260" width="215" height="110" rx="6" fill="#ffffff" stroke="#b87333" stroke-width="1.2"/>
  <text x="162" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3614">Manager 单例与配置驱动引擎</text>
  <text x="162" y="302" text-anchor="middle" font-size="10.5" fill="#444">• 全局配置解析 (config.yaml / TOML)</text>
  <text x="162" y="320" text-anchor="middle" font-size="10.5" fill="#444">• Agent / Session / Tool 生命周期注册</text>
  <text x="162" y="338" text-anchor="middle" font-size="10.5" fill="#444">• Skill 技能模板动态挂载与按需激活</text>
  <text x="162" y="356" text-anchor="middle" font-size="10.5" fill="#444">• LLM 多模型路由与并发限流控制</text>

  <rect x="288" y="260" width="225" height="110" rx="6" fill="#ffffff" stroke="#b87333" stroke-width="1.2"/>
  <text x="400" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3614">层级子会话调度与上下文隔离</text>
  <text x="400" y="302" text-anchor="middle" font-size="10.5" fill="#444">• session_create：动态派生专职子会话</text>
  <text x="400" y="320" text-anchor="middle" font-size="10.5" fill="#444">• session_query：下发子任务与回收摘要</text>
  <text x="400" y="338" text-anchor="middle" font-size="10.5" fill="#444">• ReAct 推理轨迹与独立会话窗口 H_sub</text>
  <text x="400" y="356" text-anchor="middle" font-size="10.5" fill="#444">• 防止底层表行检索细节污染顶层会话</text>

  <rect x="530" y="258" width="374" height="114" rx="6" fill="#fff7ed" stroke="#d95f02" stroke-width="1.8"/>
  <text x="717" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b34800">可追溯动态检索知识服务（built_in/rag + 本文第 3、4 章算法）</text>
  <text x="717" y="300" text-anchor="middle" font-size="10.5" fill="#222">1. 离线构建：SEAC 四信号边界打分 + 文档自适应阈值 θ_D</text>
  <text x="717" y="318" text-anchor="middle" font-size="10.5" fill="#222">2. 单索引存储：BGE-M3 编码父块 P 与表头绑定子块 C 存入 Chroma</text>
  <text x="717" y="336" text-anchor="middle" font-size="10.5" fill="#222">3. 在线路由：rag_query(query, agent_role) 查表映射 (α_r, m_r)</text>
  <text x="717" y="354" text-anchor="middle" font-size="10.5" fill="#b34800" font-weight="bold">4. 结构化输出：按需粒度证据文本 + 源文档/章节/Unit ID 出处谱系</text>

  <!-- Layer 3: Binary Tools & Storage Layer -->
  <rect x="35" y="408" width="890" height="132" rx="8" fill="#f3faf7" stroke="#1b9e77" stroke-width="1.8"/>
  <rect x="35" y="408" width="890" height="28" rx="8" fill="#1b9e77"/>
  <text x="480" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">第三层：底层编译工具链与工程知识存储层（binary-tools · Rust 工具与向量数据库）</text>

  <rect x="55" y="446" width="270" height="80" rx="6" fill="#ffffff" stroke="#1b9e77" stroke-width="1.2"/>
