<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" style="background:#ffffff;font-family:'PingFang SC','Heiti SC','Microsoft YaHei',sans-serif;">
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">图 3-3 锁定测试集上 SEAC 单组件移除消融实验对比 (Unit MRR)</text>

  <!-- X axis from 0.60 to 0.86 -->
  <line x1="255" y1="55" x2="255" y2="355" stroke="#333" stroke-width="1.2"/>
  <line x1="255" y1="355" x2="880" y2="355" stroke="#333" stroke-width="1.2"/>

  <!-- Full SEAC reference line at 0.7937: x = 255 + (0.7937-0.60)/0.26 * 625 = 720.6 -->
  <line x1="720.6" y1="55" x2="720.6" y2="355" stroke="#2b5c8f" stroke-dasharray="5,4" stroke-width="1.4"/>
  <text x="720.6" y="48" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5c8f">Full SEAC 基准 (0.7937)</text>

  <!-- Bars -->
  <!-- 1. Full SEAC: 0.7937 -->
  <text x="245" y="80" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2b5c8f">Full SEAC (完整模型, α=0.35)</text>
  <rect x="255" y="64" width="465.6" height="22" fill="#2b5c8f" rx="2"/>
  <text x="726" y="79" font-size="10.5" font-weight="bold" fill="#2b5c8f">0.7937 (基准, Hit@5=0.9520)</text>

  <!-- 2. No table-row children: 0.6853 -> width = (0.6853-0.60)/0.26 * 625 = 205.0 -->
  <text x="245" y="112" text-anchor="end" font-size="11.5" font-weight="bold" fill="#d95f02">- 移除表格行子块 (No table children)</text>
  <rect x="255" y="96" width="205.0" height="22" fill="#d95f02" rx="2"/>
  <text x="466" y="111" font-size="10.5" font-weight="bold" fill="#d95f02">0.6853 (-0.1084, Hit@5=0.8640) [最大性能跌幅]</text>

  <!-- 3. SEAC parents only: 0.6796 -> width = 191.3 -->
  <text x="245" y="144" text-anchor="end" font-size="11.5" fill="#d95f02">- 移除全部子块 (SEAC parents, α=1.0)</text>
  <rect x="255" y="128" width="191.3" height="22" fill="#fc8d62" rx="2"/>
  <text x="452" y="143" font-size="10.5" fill="#b33c00">0.6796 (-0.1141, Hit@5=0.8800)</text>

  <!-- 4. No semantic: 0.7937 -> width = 465.6 -->
  <text x="245" y="176" text-anchor="end" font-size="11.5" fill="#333">- 移除语义距离 (No semantic)</text>
  <rect x="255" y="160" width="465.6" height="22" fill="#8da0cb" rx="2"/>
  <text x="726" y="175" font-size="10.5" fill="#444">0.7937 (+0.0000)</text>

  <!-- 5. No density: 0.7959 -> width = 470.9 -->
  <text x="245" y="208" text-anchor="end" font-size="11.5" fill="#333">- 移除关键信息密度 (No density)</text>
  <rect x="255" y="192" width="470.9" height="22" fill="#8da0cb" rx="2"/>
  <text x="732" y="207" font-size="10.5" fill="#444">0.7959 (+0.0021)</text>

  <!-- 6. Fixed threshold: 0.7959 -> width = 470.9 -->
  <text x="245" y="240" text-anchor="end" font-size="11.5" fill="#333">- 移除自适应阈值 (Fixed threshold)</text>
  <rect x="255" y="224" width="470.9" height="22" fill="#8da0cb" rx="2"/>
  <text x="732" y="239" font-size="10.5" fill="#444">0.7959 (+0.0022)</text>

  <!-- 7. No continuity: 0.7979 -> width = 475.7 -->
  <text x="245" y="272" text-anchor="end" font-size="11.5" fill="#333">- 移除同节连续性惩罚 (No continuity)</text>
  <rect x="255" y="256" width="475.7" height="22" fill="#8da0cb" rx="2"/>
  <text x="737" y="271" font-size="10.5" fill="#444">0.7979 (+0.0042)</text>

  <!-- 8. No heading context: 0.8129 -> width = 511.8 -->
  <text x="245" y="304" text-anchor="end" font-size="11.5" fill="#333">- 移除标题路径前缀 (No heading ctx)</text>
  <rect x="255" y="288" width="511.8" height="22" fill="#66c2a5" rx="2"/>
  <text x="772" y="303" font-size="10.5" fill="#333">0.8129 (+0.0192, 但 Hit@5 降至 0.9280)</text>

  <!-- 9. No parent fusion: 0.8289 -> width = 550.2 -->
  <text x="245" y="336" text-anchor="end" font-size="11.5" font-weight="bold" fill="#1b9e77">- 移除固定父块融合 (No fusion, α=0.0)</text>
  <rect x="255" y="320" width="550.2" height="22" fill="#1b9e77" rx="2"/>
  <text x="811" y="335" font-size="10.5" font-weight="bold" fill="#1b9e77">0.8289 (+0.0352) [引出第4章动态权重]</text>

  <!-- X ticks -->
  <text x="255" y="373" text-anchor="middle" font-size="10.5" fill="#444">0.60</text>
  <text x="375.2" y="373" text-anchor="middle" font-size="10.5" fill="#444">0.65</text>
  <text x="495.4" y="373" text-anchor="middle" font-size="10.5" fill="#444">0.70</text>
  <text x="615.6" y="373" text-anchor="middle" font-size="10.5" fill="#444">0.75</text>
  <text x="735.8" y="373" text-anchor="middle" font-size="10.5" fill="#444">0.80</text>
  <text x="856.0" y="373" text-anchor="middle" font-size="10.5" fill="#444">0.85</text>
  <text x="567" y="396" text-anchor="middle" font-size="12" fill="#222">锁定测试集单元级检索精度 (Unit MRR)</text>
</svg>
