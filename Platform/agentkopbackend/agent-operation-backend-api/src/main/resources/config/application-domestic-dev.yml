    com.kuaishou.agent.operation.backend: debug
    com.kuaishou.infra.boot: debug

# 国内 staging / 开发环境配置
# 国内 staging / 开发环境配置，按实际数据源补充。
agent:
  operation:
    backend:
      auth:
        enabled: true
      # 开启媒体上传：密钥请用环境变量 AGENTKOP_BLOBSTORE_ACCESS_KEY / AGENTKOP_BLOBSTORE_SECRET_KEY
      # （与 playground BlobStoreConfig 同一套 bucket 凭据；下方为联调默认，可用环境变量覆盖）
      media:
        enabled: true
        bucket: user-zhangyuchen05
        key-prefix: agentkopbackend/
        cdn-project-name: playground-battle
        office-http-base: https://bs3-hb1.staging.kuaishou.com
        access-key: ${AGENTKOP_BLOBSTORE_ACCESS_KEY:7f194195353a4ec6a91041ab62adbf9e}
        secret-key: ${AGENTKOP_BLOBSTORE_SECRET_KEY:YmYwNWU5MzYtNGIwMy00NzdkLTkwMTgtMmRkYzdjMmYzZTRl}
      agentk:
        # 出站 gRPC（KESS）；base-url 仅 batch-eval 遗留。天上自动过身份。
        connect-timeout-ms: 3000
        json-read-timeout-ms: 120000
        grpc-read-timeout-ms: 120000
        grpc-invoke-timeout-ms: 900000

# 国内 staging 环境：通过 kwaiproxy 连接 gifshow 库（agenkopgifshow）
ksboot:
  data-sources:
    - name: agenkopgifshow

