[project]
name = "ks-agentk-protocol"
version = "0.4.2"
description = "Generated Python protocol for AgentK"
requires-python = ">=3.12,<4"
dependencies = [
  "connectrpc",
  "protobuf-py",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentk"
namespace = true
